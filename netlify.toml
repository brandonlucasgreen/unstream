[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "api/functions"
  edge_functions = "api/edge"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' gc.zgo.at letterbird.co; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://unstream.goatcounter.com https://letterbird.co https://*.ingest.sentry.io; img-src 'self' https: data:; frame-src https:; object-src 'none'; base-uri 'self'"

[[edge_functions]]
  path = "/"
  function = "og-metadata"

# MUST stay above the /a/* entry below. Edge functions run in declaration order, and `/a/*`
# matches /a/{artist}/{release} too — declared first, artist-page-static would look up an
# artist whose slug is "artist/release", find nothing, and fall through. It would still work,
# but only by accident, and it would cost a database query on every release page view.
#
# A regex rather than a path glob because the distinction that matters here is the number of
# path segments: exactly two under /a/. Netlify's `path` globs can't express that.
[[edge_functions]]
  pattern = "^/a/[^/]+/[^/]+/?$"
  function = "release-page"

[[edge_functions]]
  path = "/artist/*"
  function = "artist-page-static"

[[edge_functions]]
  path = "/a/*"
  function = "artist-page-static"

[[edge_functions]]
  path = "/search"
  function = "noscript-search"

[[edge_functions]]
  path = "/guides/*"
  function = "guide-page"

[[edge_functions]]
  path = "/u/*"
  function = "u-handle"

