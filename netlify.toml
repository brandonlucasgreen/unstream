[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "api/functions"
  edge_functions = "api/edge"
  # Cancel deploys for pushes that cannot change what we publish — Apple app,
  # browser extension, migrations, docs. Note the inverted exit code (0 cancels the
  # build); the script explains itself and errs toward deploying.
  ignore = "bash scripts/netlify-ignore-build.sh"

# Deploy Previews are the single largest consumer of build minutes here: ~200 PRs a
# month at ~1.4 min each is ~280 of a 300-minute allowance, spent on previews that are
# rarely opened because testing happens against production instead. Production deploys
# at the same cadence cost ~196 min and fit comfortably — so this block, not the
# per-path script above, is what keeps the site inside the free tier.
#
# Context settings override the [build] ones, so previews get this instead of the
# script. Same inverted exit code: 0 cancels the build.
#
# To get previews back — which is the right move once local dev can stand in for them,
# since this removes the last chance to exercise the real backend before merging —
# delete this block. Nothing else depends on it.
[context.deploy-preview]
  ignore = "exit 0"

# `netlify dev` — the local full stack, and what `npm run dev` runs. Serves the real functions
# and edge functions on :8888 in front of Vite, so local behaviour matches production instead of
# the drifted `apps/web/server/` shim (see "Local dev API vs production API" in CLAUDE.md).
#
# `targetPort` must match the port in `dev:fast`, and that script passes `--strictPort` on
# purpose. Without it Vite silently moves to the next free port when 5173 is taken, `netlify dev`
# keeps proxying to whatever else is on 5173 — a stale server from another checkout, say — and
# every page you look at is somebody else's build with no error anywhere. That happened here on
# 2026-08-15: a Vite left running two days earlier answered every request through :8888.
# `--strictPort` turns that silent wrong answer into a startup failure.
#
# `framework = "#custom"` disables auto-detection, which otherwise guesses the port it just
# watched Vite fail to bind.
[dev]
  command = "npm run dev:fast"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# The staleness probe in buildFreshness.ts compares this file's id against the one baked into
# the running bundle. A cached response would echo the tab's own build back to it forever, so
# the banner would never appear. `no-store` on the request isn't enough on its own — the CDN
# would still be free to hand out a stale copy.
[[headers]]
  for = "/build-id.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# The one file that must never be answered from cache, for the same reason as the one above —
# and the pair belongs together. `/build-id.json` is how staleness is DETECTED; this is how it
# gets RESOLVED. The browser discovers a new worker only by re-fetching /sw.js, so under
# Netlify's default `max-age=14400` that check can be satisfied by a four-hour-old copy while
# the installed worker keeps serving its precached build.
#
# That is not theoretical: on 2026-08-24 a Safari session was pinned to a build whose
# /assets/* had all been deleted, running that dead code until it threw. Protecting only the
# detector is the worst of both — the banner appears, and the refresh behind it re-serves the
# very build it is warning about.
#
# `max-age=0, must-revalidate` rather than `no-store`: it still forces a check on every
# request, but lets the ETag answer 304 instead of resending the file. It is also exactly what
# Netlify already serves for index.html, which has the identical requirement.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  # connect-src note: Sentry's ingest host is region-scoped — ours is
  # o…ingest.us.sentry.io. `*.ingest.sentry.io` does NOT cover it: CSP host wildcards are a
  # suffix match, and `.ingest.sentry.io` is not a suffix of `.ingest.us.sentry.io`. That
  # one missing `us.` silently dropped every browser error event between setup and 2026-08-01.
  # If the Sentry org ever moves region, this host has to move with it.
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' gc.zgo.at letterbird.co; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://unstream.goatcounter.com https://letterbird.co https://*.ingest.us.sentry.io; img-src 'self' https: data:; frame-src https:; object-src 'none'; base-uri 'self'"

[[edge_functions]]
  path = "/"
  function = "og-metadata"

# MUST stay above the /a/* entry below. Edge functions run in declaration order, and `/a/*`
# matches /a/{artist}/{release} too — declared first, artist-page-static would look up an
# artist whose slug is "artist/release", find nothing, and fall through. It would still work,
# but only by accident, and it would cost a database query on every release page view.
#
# A regex rather than a path glob because the distinction that matters here is the number of
# path segments: exactly two under /a/. Netlify's `path` globs can't express that.
[[edge_functions]]
  pattern = "^/a/[^/]+/[^/]+/?$"
  # /a/{artist}/releases.xml is two segments too, so without this the release-page renderer
  # would try to look up a release whose slug is "releases.xml". Feeds are served by a Netlify
  # function (see the /a/*/releases.* redirect below) — edge functions run *before* redirects,
  # so the exclusion has to be declared here or the redirect is never reached.
  excludedPattern = "^/a/[^/]+/releases\\.(ics|xml)$"
  function = "release-page"

[[edge_functions]]
  path = "/artist/*"
  function = "artist-page-static"

[[edge_functions]]
  path = "/a/*"
  # Same exclusion, for the same reason: excluding the feed path from release-page above only
  # drops it through to this entry, whose glob matches it just as happily.
  excludedPattern = "^/a/[^/]+/releases\\.(ics|xml)$"
  function = "artist-page-static"

[[edge_functions]]
  path = "/search"
  function = "noscript-search"

[[edge_functions]]
  path = "/guides/*"
  function = "guide-page"

[[edge_functions]]
  path = "/u/*"
  # /u/{handle}/releases.ics and .xml are feeds, not the shared-list HTML page.
  excludedPattern = "^/u/[^/]+/releases\\.(ics|xml)$"
  function = "u-handle"

# Link previews for the hand-written static pages. Their titles are set client-side, so without
# this an unfurl of /press — the URL that goes in every press pitch — shows the homepage's card.
[[edge_functions]]
  path = "/press"
  function = "static-page-meta"

[[edge_functions]]
  path = "/contact"
  function = "static-page-meta"

