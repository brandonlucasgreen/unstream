# Release feeds. All three shapes hit one function, which reads the route off the path.
#
# These MUST stay above the SPA catch-all: redirects are first-match-wins, and `/*` would
# otherwise hand a calendar client an HTML page. The two public ones also need the
# `excludedPattern` entries on the /a/* and /u/* edge functions above, since edge functions run
# before redirects.
[[redirects]]
  from = "/feed/f/*"
  to = "/.netlify/functions/feed-releases"
  status = 200

[[redirects]]
  from = "/u/:handle/releases.ics"
  to = "/.netlify/functions/feed-releases"
  status = 200

[[redirects]]
  from = "/u/:handle/releases.xml"
  to = "/.netlify/functions/feed-releases"
  status = 200

[[redirects]]
  from = "/a/:artist/releases.xml"
  to = "/.netlify/functions/feed-releases"
  status = 200

[[redirects]]
  from = "/a/:artist/releases.ics"
  to = "/.netlify/functions/feed-releases"
  status = 200

[[redirects]]
  from = "/api/me/feed-token"
  to = "/.netlify/functions/me-feed-token"
  status = 200

# The "Recent Releases" shortlist on /dashboard — the same window the private feed above serves,
# read straight rather than as a calendar.
[[redirects]]
  from = "/api/me/recent-releases"
  to = "/.netlify/functions/me-recent-releases"
  status = 200

# One release's buying guide as JSON — the twin of the HTML page at /a/:artist/:release, for the
# Mac app and the browser extension.
#
# The function reads the two slugs out of `rawUrl`, the same way feed-releases.ts above does.
# This was first written as `to = ".../release-detail?artist=:artist&release=:release"`, on the
# assumption that Netlify substitutes `from` placeholders into the destination's query string.
# **It does not.** Verified on deploy preview 393: the rewrite matched and the function ran, but
# `queryStringParameters` was empty, so every request 400'd. Don't reintroduce that form.
[[redirects]]
  from = "/api/release/:artist/:release"
  to = "/.netlify/functions/release-detail"
  status = 200

[[redirects]]
  from = "/plus"
  to = "/support"
  status = 301

# SPA catch-all: serve index.html for all routes (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
