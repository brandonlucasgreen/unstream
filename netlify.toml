[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "api/functions"
  edge_functions = "api/edge"

[[headers]]
  for = "/*"
  # connect-src note: Sentry's ingest host is region-scoped — ours is
  # o…ingest.us.sentry.io. `*.ingest.sentry.io` does NOT cover it: CSP host wildcards are a
  # suffix match, and `.ingest.sentry.io` is not a suffix of `.ingest.us.sentry.io`. That
  # one missing `us.` silently dropped every browser error event between setup and 2026-08-01.
  # If the Sentry org ever moves region, this host has to move with it.
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' gc.zgo.at letterbird.co; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://unstream.goatcounter.com https://letterbird.co https://*.ingest.us.sentry.io; img-src 'self' https: data:; frame-src https:; object-src 'none'; base-uri 'self'"

[[edge_functions]]
  path = "/"
  function = "og-metadata"

# MUST stay above the /a/* entry below. Edge functions run in declaration order, and `/a/*`
# matches /a/{artist}/{release} too — declared first, artist-page-static would look up an
# artist whose slug is "artist/release", find nothing, and fall through. It would still work,
# but only by accident, and it would cost a database query on every release page view.
#
# A regex rather than a path glob because the distinction that matters here is the number of
# path segments: exactly two under /a/. Netlify's `path` globs can't express that.
[[edge_functions]]
  pattern = "^/a/[^/]+/[^/]+/?$"
  # /a/{artist}/releases.xml is two segments too, so without this the release-page renderer
  # would try to look up a release whose slug is "releases.xml". Feeds are served by a Netlify
  # function (see the /a/*/releases.* redirect below) — edge functions run *before* redirects,
  # so the exclusion has to be declared here or the redirect is never reached.
  excludedPattern = "^/a/[^/]+/releases\\.(ics|xml)$"
  function = "release-page"

[[edge_functions]]
  path = "/artist/*"
  function = "artist-page-static"

[[edge_functions]]
  path = "/a/*"
  # Same exclusion, for the same reason: excluding the feed path from release-page above only
  # drops it through to this entry, whose glob matches it just as happily.
  excludedPattern = "^/a/[^/]+/releases\\.(ics|xml)$"
  function = "artist-page-static"

[[edge_functions]]
  path = "/search"
  function = "noscript-search"

[[edge_functions]]
  path = "/guides/*"
  function = "guide-page"

[[edge_functions]]
  path = "/u/*"
  # /u/{handle}/releases.ics and .xml are feeds, not the shared-list HTML page.
  excludedPattern = "^/u/[^/]+/releases\\.(ics|xml)$"
  function = "u-handle"

# Link previews for the hand-written static pages. Their titles are set client-side, so without
# this an unfurl of /press — the URL that goes in every press pitch — shows the homepage's card.
[[edge_functions]]
  path = "/press"
  function = "static-page-meta"

[[edge_functions]]
  path = "/contact"
  function = "static-page-meta"

