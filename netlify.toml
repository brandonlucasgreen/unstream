[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "api/functions"
  edge_functions = "api/edge"

[[edge_functions]]
  path = "/"
  function = "og-metadata"

[[edge_functions]]
  path = "/artist/*"
  function = "artist-page"

[[edge_functions]]
  path = "/a/*"
  function = "claimed-artist-page"

[[edge_functions]]
  path = "/artists"
  function = "artist-directory-page"

[[redirects]]
  from = "/api/artist-directory"
  to = "/.netlify/functions/artist-directory"
  status = 200

[[redirects]]
  from = "/api/search/sources"
  to = "/.netlify/functions/search-sources"
  status = 200

[[redirects]]
  from = "/api/search/musicbrainz"
  to = "/.netlify/functions/search-musicbrainz"
  status = 200

[[redirects]]
  from = "/api/embed/bandcamp"
  to = "/.netlify/functions/embed-bandcamp"
  status = 200

[[redirects]]
  from = "/api/resolve/url"
  to = "/.netlify/functions/resolve-url"
  status = 200

[[redirects]]
  from = "/api/artist"
  to = "/.netlify/functions/artist-lookup"
  status = 200

[[redirects]]
  from = "/api/claim"
  to = "/.netlify/functions/claim-artist"
  status = 200

[[redirects]]
  from = "/api/artist-auth"
  to = "/.netlify/functions/artist-auth"
  status = 200

[[redirects]]
  from = "/api/artist-profile"
  to = "/.netlify/functions/artist-profile"
  status = 200

[[redirects]]
  from = "/api/desktop/version"
  to = "/.netlify/functions/desktop-version"
  status = 200

[[redirects]]
  from = "/plus"
  to = "/support"
  status = 301

# SPA catch-all: serve index.html for all routes (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
