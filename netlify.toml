[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "api/functions"
  edge_functions = "api/edge"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' gc.zgo.at letterbird.co; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://unstream.goatcounter.com https://letterbird.co https://*.ingest.sentry.io; img-src 'self' https: data:; frame-src https:; object-src 'none'; base-uri 'self'"

[[edge_functions]]
  path = "/"
  function = "og-metadata"

[[edge_functions]]
  path = "/artist/*"
  function = "artist-page"

[[edge_functions]]
  path = "/a/*"
  function = "artist-page-static"

[[edge_functions]]
  path = "/search"
  function = "noscript-search"

[[edge_functions]]
  path = "/guides/*"
  function = "guide-page"

[[redirects]]
  from = "/api/artist-directory"
  to = "/.netlify/functions/artist-directory"
  status = 200

[[redirects]]
  from = "/api/search/sources"
  to = "/.netlify/functions/search-sources"
  status = 200

[[redirects]]
  from = "/api/search/musicbrainz"
  to = "/.netlify/functions/search-musicbrainz"
  status = 200

[[redirects]]
  from = "/api/embed/bandcamp"
  to = "/.netlify/functions/embed-bandcamp"
  status = 200

[[redirects]]
  from = "/api/resolve/url"
  to = "/.netlify/functions/resolve-url"
  status = 200

[[redirects]]
  from = "/api/artist"
  to = "/.netlify/functions/artist-lookup"
  status = 200

[[redirects]]
  from = "/api/claim"
  to = "/.netlify/functions/claim-artist"
