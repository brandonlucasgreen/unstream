name: Unstream
options:
  bundleIdPrefix: lol.bgreen
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

schemes:
  Unstream:
    build:
      targets:
        Unstream: all
        UnstreamShareExtension: all
    test:
      targets:
        - UnstreamTests
    archive:
      config: Release

settings:
  SWIFT_VERSION: "5.9"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.44.1
  # Sparkle ships as a binary XCFramework, and the Installer/Downloader XPC services
  # the sandbox needs live inside Sparkle.framework — nothing extra to bundle. macOS
  # only: the iOS app updates through the App Store.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.6

targets:
  Unstream:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Unstream
        excludes:
          - "Platform/macOS/**"
          - "Views/macOS/**"
          - "Views/iOS/**"
          - "Info-macOS.plist"
          - "Info-iOS.plist"
      - path: Unstream/Platform/macOS
        destinationFilters: [macOS]
      - path: Unstream/Views/macOS
        destinationFilters: [macOS]
      - path: Unstream/Views/iOS
        destinationFilters: [iOS]
    resources:
      - path: Unstream/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.Unstream
      PRODUCT_NAME: Unstream
      "INFOPLIST_FILE[sdk=macosx*]": Unstream/Info-macOS.plist
      "INFOPLIST_FILE[sdk=iphoneos*]": Unstream/Info-iOS.plist
      "INFOPLIST_FILE[sdk=iphonesimulator*]": Unstream/Info-iOS.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "CV926C8KS8"
      "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Unstream/Unstream-macOS.entitlements
      "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Unstream/Unstream-iOS.entitlements
      "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Unstream/Unstream-iOS.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # XcodeGen emits one LD_RUNPATH_SEARCH_PATHS for this multi-platform target and picks
      # the iOS layout (@executable_path/Frameworks). A macOS app keeps embedded frameworks in
      # Contents/Frameworks, one level ABOVE Contents/MacOS, so with only the iOS path dyld
      # can't find Sparkle and the app dies at launch with "Library not loaded:
      # @rpath/Sparkle.framework". A Debug build hides this (everything links through
      # Unstream.debug.dylib) and CI only compiles, so nothing but launching an exported
      # Release build catches it.
      "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: UnstreamShareExtension
        destinationFilters: [iOS]
      - package: Supabase
        product: Supabase
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]

  UnstreamShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - UnstreamShareExtension
    resources:
      - path: UnstreamShareExtension/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.Unstream.ShareExtension
      PRODUCT_NAME: UnstreamShare
      INFOPLIST_FILE: UnstreamShareExtension/Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "CV926C8KS8"
      CODE_SIGN_ENTITLEMENTS: UnstreamShareExtension/ShareExtension.entitlements
    info:
      path: UnstreamShareExtension/Info.plist
      properties:
        CFBundleName: UnstreamShare
        CFBundleDisplayName: Share to Unstream
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "17"
        CFBundleShortVersionString: "3.6.1"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController

  UnstreamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - UnstreamTests
    dependencies:
      - target: Unstream
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.UnstreamTests
      PRODUCT_NAME: UnstreamTests
      INFOPLIST_FILE: UnstreamTests/Info.plist
      DEVELOPMENT_TEAM: "CV926C8KS8"
      # macOS app executable lives in Contents/MacOS; xcodegen's auto TEST_HOST
      # omits BUNDLE_EXECUTABLE_FOLDER_PATH and resolves to the wrong path.
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Unstream.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unstream"
      BUNDLE_LOADER: "$(TEST_HOST)"
