name: Unstream
options:
  bundleIdPrefix: lol.bgreen
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

schemes:
  Unstream:
    build:
      targets:
        Unstream: all
        UnstreamShareExtension: all
    archive:
      config: Release

settings:
  SWIFT_VERSION: "5.9"

targets:
  Unstream:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Unstream
        excludes:
          - "Platform/macOS/**"
          - "Views/macOS/**"
          - "Views/iOS/**"
      - path: Unstream/Platform/macOS
        destinationFilters: [macOS]
      - path: Unstream/Views/macOS
        destinationFilters: [macOS]
      - path: Unstream/Views/iOS
        destinationFilters: [iOS]
    resources:
      - path: Unstream/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.Unstream
      PRODUCT_NAME: Unstream
      INFOPLIST_FILE: Unstream/Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "CV926C8KS8"
      CODE_SIGN_ENTITLEMENTS:
        "[sdk=macosx*]": Unstream/Unstream-macOS.entitlements
        "[sdk=iphoneos*]": Unstream/Unstream-iOS.entitlements
        "[sdk=iphonesimulator*]": Unstream/Unstream-iOS.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: UnstreamShareExtension
        destinationFilters: [iOS]
    info:
      path: Unstream/Info.plist
      properties:
        CFBundleName: Unstream
        CFBundleDisplayName: Unstream
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "8"
        CFBundleShortVersionString: "3.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright 2025-2026 brandon lucas green"
        NSAppleEventsUsageDescription: "Unstream needs to check what music is playing so it can find the artist on ethical platforms."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - unstream
            CFBundleURLName: lol.bgreen.Unstream
        BGTaskSchedulerPermittedIdentifiers:
          - lol.bgreen.Unstream.releaseCheck
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  UnstreamShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - UnstreamShareExtension
    resources:
      - path: UnstreamShareExtension/PrivacyInfo.xcprivacy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.Unstream.ShareExtension
      PRODUCT_NAME: UnstreamShare
      INFOPLIST_FILE: UnstreamShareExtension/Info.plist
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "CV926C8KS8"
      CODE_SIGN_ENTITLEMENTS: UnstreamShareExtension/ShareExtension.entitlements
    info:
      path: UnstreamShareExtension/Info.plist
      properties:
        CFBundleName: UnstreamShare
        CFBundleDisplayName: Share to Unstream
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "8"
        CFBundleShortVersionString: "3.0.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
