<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unstream" />
    <title>Unstream - Find the best places online to directly support the music artists you love</title>
    <meta name="description" content="Search any artist. See where your money actually goes. Unstream shows artist payout percentages across 17+ platforms. Free and open source." />
    <meta property="og:title" content="Unstream - Find the best places online to directly support the music artists you love" />
    <meta property="og:description" content="Search any artist. See where your money actually goes. Unstream shows artist payout percentages across 17+ platforms. Free and open source." />
    <meta property="og:image" content="https://unstream.stream/og-image.png" />
    <meta property="og:url" content="https://unstream.stream" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://unstream.stream/og-image.png" />
    <!-- Feed auto-discovery. Site-wide rather than per-page: these are static tags and the
         SPA doesn't rewrite them, so a reader finds both feeds from any URL. -->
    <link rel="alternate" type="application/rss+xml" title="Unstream Guides" href="/guides.xml" />
    <link rel="alternate" type="application/rss+xml" title="Unstream Changelog" href="/changelog.xml" />
    <link rel="preconnect" href="https://api.fonts.coollabs.io">
    <link rel="preconnect" href="https://cdn.fonts.coollabs.io" crossorigin>
    <!-- Darker Grotesque carries the headings; Stack Sans Headline stays the body face. -->
    <link href="https://api.fonts.coollabs.io/css2?family=Darker+Grotesque:wght@300..900&family=Stack+Sans+Headline:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        :root { --ns-bg: #0d0d0d; --ns-bg2: #1a1a1a; --ns-text: #f0f0f0; --ns-muted: #999; --ns-border: #2a2a2a; --ns-accent: #ff6b35; }
        @media (prefers-color-scheme: light) {
          :root { --ns-bg: #ffffff; --ns-bg2: #f5f5f5; --ns-text: #1a1a1a; --ns-muted: #555; --ns-border: #e0e0e0; --ns-accent: #e55a2b; }
        }
        .noscript-fallback {
          position: fixed; inset: 0; z-index: 9999;
          background: var(--ns-bg); color: var(--ns-text);
          font-family: 'Stack Sans Headline', system-ui, sans-serif;
          display: flex; flex-direction: column; align-items: center;
          justify-content: center; padding: 24px; text-align: center;
        }
        .noscript-fallback h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .noscript-fallback p { font-size: 16px; color: var(--ns-muted); margin-bottom: 32px; max-width: 480px; }
        .noscript-form { display: flex; gap: 8px; width: 100%; max-width: 480px; }
        .noscript-form input {
          flex: 1; padding: 14px 18px; border-radius: 12px;
          border: 1px solid var(--ns-border); background: var(--ns-bg2);
          color: var(--ns-text); font-size: 16px; font-family: inherit;
        }
        .noscript-form button {
          padding: 14px 28px; border-radius: 12px; border: none;
          background: var(--ns-accent); color: #fff;
          font-size: 16px; font-family: inherit; font-weight: 600; cursor: pointer;
        }
        .noscript-form button:hover { opacity: 0.9; }
        .noscript-note { font-size: 13px; color: var(--ns-muted); margin-top: 24px; }
        .noscript-note a { color: var(--ns-accent); }
      </style>
      <div class="noscript-fallback">
        <h1>Unstream</h1>
        <p>Find music on platforms that pay artists fairly. Search any artist to see where your money actually goes.</p>
        <form class="noscript-form" action="/search" method="get">
          <input type="text" name="q" placeholder="Search for an artist..." autofocus>
          <button type="submit">Search</button>
        </form>
        <p class="noscript-note">You're viewing Unstream without JavaScript. Core search works, but some features require JS. <a href="/artists">Browse the artist index</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Give GoatCounter the page, not the query string. Its default path is
         `location.pathname + location.search`, and a search puts the artist name straight into
         the URL (/?q=artist+name), so the default records every search term as a page path — on
         a dashboard that's public. We only want page-level counts here; a search that goes wrong
         is Sentry's job, not the analytics tool's.
         Events fired from services/analytics.ts pass an explicit path and are unaffected.
         This must stay ahead of count.js: settings are read when it loads. -->
    <script>window.goatcounter = { path: function () { return location.pathname || '/' } }</script>
    <script data-goatcounter="https://unstream.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
