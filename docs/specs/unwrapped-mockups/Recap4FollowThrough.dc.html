<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap did you buy anything</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@600;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ff6b35}a:hover{color:#ff8a5c}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #f0f0f0; font-family: 'Stack Sans Headline', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 24px 32px 24px;">
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;" aria-hidden="true">
    <span style="height: 3px; border-radius: 2px; background: #f0f0f0;"></span>
    <span style="height: 3px; border-radius: 2px; background: #f0f0f0;"></span>
    <span style="height: 3px; border-radius: 2px; background: #f0f0f0;"></span>
    <span style="height: 3px; border-radius: 2px; background: #f0f0f0;"></span>
    <span style="height: 3px; border-radius: 2px; background: #333333;"></span>
    <span style="height: 3px; border-radius: 2px; background: #333333;"></span>
  </div>

  <h2 style="margin: 44px 0 0 0; font-family: 'Darker Grotesque', system-ui, sans-serif; font-weight: 900; font-size: 46px; line-height: 0.9; letter-spacing: -0.8px;">You went to buy from 4 artists. Did you?</h2>
  <p style="margin: 12px 0 0 0; font-size: 14px; line-height: 1.45; color: #b5b5b5;">We saw the click, not the checkout. A yes counts them as supported.</p>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #1a1a1a; border: 1px solid {{row.border}};">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600;">{{row.name}}</span>
          <span style="font-size: 12px; color: #999999;">{{row.why}}</span>
        </div>
        <sc-if value="{{row.unanswered}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <button onClick="{{row.yes}}" style="height: 44px; border-radius: 8px; border: 0; background: #4ecdc4; color: #08201e; font-size: 14px; font-weight: 600;">Yes, I bought something</button>
            <button onClick="{{row.no}}" style="height: 44px; border-radius: 8px; border: 1px solid #3a3a3a; background: transparent; color: #f0f0f0; font-size: 14px;">Not yet</button>
          </div>
        </sc-if>
        <sc-if value="{{row.saidYes}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; color: #4ecdc4;">Counted as supported. Nice.</span>
        </sc-if>
        <sc-if value="{{row.saidNo}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; color: #ffe66d;">Added to who you could back.</span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <span style="flex-grow: 1;"></span>
  <a href="Recap5List.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 10px; background: #f0f0f0; color: #121212; font-size: 16px; font-weight: 600; text-decoration: none;">Next</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { answers: {} };
  }
  renderVals() {
    const artists = [
      { id: 'a', name: 'Wednesday', why: 'Opened Bandcamp 3 times · last in August' },
      { id: 'b', name: 'Nilüfer Yanya', why: 'Opened Bandcamp once · in April' },
      { id: 'c', name: 'Ratboys', why: 'Opened Mirlo twice · last in October' },
      { id: 'd', name: 'Horse Jumper of Love', why: 'Opened Bandcamp on Bandcamp Friday, 6 Nov' }
    ];
    const set = (id, v) => this.setState({ answers: { ...this.state.answers, [id]: v } });
    const rows = artists.map((a) => {
      const ans = this.state.answers[a.id];
      return {
        ...a,
        unanswered: !ans,
        saidYes: ans === 'yes',
        saidNo: ans === 'no',
        border: ans === 'yes' ? '#4ecdc4' : '#2a2a2a',
        yes: () => set(a.id, 'yes'),
        no: () => set(a.id, 'no')
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
