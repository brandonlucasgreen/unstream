name: Release catalogue sweep

# Builds and refreshes release catalogues in the background.
#
# Every other catalog trigger is demand-driven: a save, a collection import, an artist's own
# button. So an artist who is catalogued once quietly stops producing release alerts, and their
# artist page keeps showing the releases they had that day. See api/functions/recatalog-sweep.ts.
#
# A GitHub Actions cron rather than a scheduled Netlify function: there are no scheduled Netlify
# functions in this repo, and this is the established precedent (schedule-social-posts.yml,
# upstash-keepalive.yml).
#
# ## Cadence: once a day
#
# One run asks for at most 25 artists — one background invocation's worth — so one run a day is
# 25 artists daily. It was four runs (100 a day) until 2026-09-06, halved to two as part of disk
# I/O round 4 (docs/specs/supabase-disk-io-investigation.md) because with the `searched` trigger
# gone (#494) the sweep is the largest remaining writer, and halved again on 2026-10-19 after the
# instance went unresponsive overnight on 10-18 and 10-19.
#
# **That second halving does not claim the sweep caused those outages — it didn't.** Both nights
# it failed on its *first* database read, which is a job noticing a wedged instance, not wedging
# one; round 7 measured the cause as the Nano's memory ceiling (~1.27 GB committed against ~1.25
# GB, ~400 MB swapped, flat around the clock) and the fix is Supabase Pro. This is the one lever
# available without a plan change, taken deliberately with that in mind.
#
# **Restore `0 1,13 * * *` as soon as the instance has headroom** — that is the first thing to put
# back, ahead of `0 1,7,13,19 * * *`, because at 25 a day the queue has almost no slack:
# measured on 2026-10-18 the sweep reported `eligible: 163` against a 7-day cooldown, which is
# 6.5 days to drain the queue at 25 a day against 3.3 days at 50. One failed or skipped run and
# the artists at the back slip a cycle, so a saved artist's alert can be a week late rather than
# arriving the day their cooldown expires.
#
# Since 2026-09-13 the sweep builds a first catalogue only for artists somebody has saved, claimed
# or has in a connected collection (disk I/O round 5 — the pool was growing by ~46 searched
# artists a day against a sweep of 50, so nearly every slot was a first-time crawl). Since
# 2026-09-19 the same demand signals gate the refresh too (round 6, after the instance wedged):
# an artist already catalogued whom nobody follows stops being refreshed — their page keeps
# rendering the frozen catalogue — and is reported as `frozenCatalogues`. At 25 a day that means:
#
#   - Saved, claimed and collected artists come round roughly as their 7-day cooldown expires.
#     They are the whole queue now, and there are a few hundred of them at most — but see the
#     slack arithmetic above: at this cadence the queue only just drains inside the cooldown,
#     where at 50 a day it had days to spare. `eligible` climbing run after run is the signal
#     that it no longer does.
#   - `awaitingDemand` (never catalogued) and `frozenCatalogues` (catalogued, now frozen) growing
#     in the log is search traffic and the gate working, not a backlog. `catalogueable`
#     collapsing, or `eligible` at 0 while the saved/claimed/collected counts and `inCooldown`
#     don't explain it, still means a broken selection query.
#
# What it costs the sites we crawl: the background function paces itself at one second between
# artists and one second between release-page fetches, and stops starting them nine minutes into
# a fifteen-minute invocation. At the response times measured on 2026-08-07 that deadline allows
# roughly 160 release pages per run, on top of one grid page per Bandcamp artist (~17 of a
# 25-artist batch). One run is therefore on the order of 175 sequential Bandcamp requests a day,
# with a hard ceiling of 325 if Bandcamp ever answers fast enough to reach the 300-fetch
# backstop — well under one request a minute averaged, and never more than one a second, against
# robots-permitted paths. It was ~350/day at two runs.
#
# At four runs that was ~470/day until the detail cap was raised from 100, which had been rationing one
# invocation's release-page reads across the whole batch and leaving the artists late in each
# sweep unpriced. The extra cost is also self-limiting: a release page is re-read only every 90
# days (DETAIL_REFRESH_DAYS), so once the backlog drains the raised cap goes largely unspent.
#
# The lever if the *artist* tail needs to be tighter is this cadence, not the batch size, which is
# capped by what one invocation can do. Note the two are different problems — see the
# SWEEP_BATCH_SIZE comment in api/functions/recatalog-sweep.ts.
#
# Safe to over-run. A duplicate invocation finds the same artists claimed and does nothing, so
# re-running by hand is free.
#
# ## Why this calls unstream.netlify.app, not unstream.stream (2026-10-13)
#
# On 2026-10-12 Bot Fight Mode was enabled on the unstream.stream zone. Free-plan BFM has no
# exceptions: it managed-challenges the runner's curl POST *before* the custom-rules pipeline
# runs, so even an explicit skip rule (id 57b608…) for the sweep path can't exempt it — the
# workflow has been failing 403 "Just a moment…" since 2026-10-12T21:29Z (runs 38310947596,
# 38361485988). Routing to the DNS-only netlify.app host keeps CF out of the path entirely.
# The function is still secret-gated (401 without the right Bearer), so the unproxied target
# adds no new surface — see the firewall-event evidence in docs/ if this reads as arbitrary.
# Revisit if the zone ever moves to Pro/SBFM, which honors skip rules.

on:
  schedule:
    - cron: '0 1 * * *' # Once a day, offset off the top-of-day cron rush
  workflow_dispatch: # Manual trigger from the GitHub UI

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Request a re-catalogue of the stalest saved artists
        env:
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        run: |
          if [ -z "$INTERNAL_FUNCTION_SECRET" ]; then
            echo "::error::INTERNAL_FUNCTION_SECRET secret is not set"
            exit 1
          fi

          response=$(curl -sS -X POST -w '\n%{http_code}' \
            -H "Authorization: Bearer $INTERNAL_FUNCTION_SECRET" \
            https://unstream.netlify.app/.netlify/functions/recatalog-sweep)

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          # Any non-200 fails the run on purpose. A sweep that reports success while refusing to
          # do anything — cataloging disabled, database unreadable — is the exact silent failure
          # this workflow exists to prevent.
          if [ "$status" != "200" ]; then
            echo "::error::Sweep failed with HTTP $status: $body"
            exit 1
          fi

          # Worth reading rather than skipping past. `requested: 0` is fine when `inCooldown`
          # accounts for the whole `catalogueable` pool — everything really is caught up. It is
          # not fine if `catalogueable` has collapsed, which is what a broken or truncated
          # selection query looks like, and the two are indistinguishable without these counts.
          echo "Sweep OK: $body"

      - name: Alert on failure (ntfy push)
        if: failure()
        env:
          NTFY_CI_TOPIC: ${{ secrets.NTFY_CI_TOPIC }}
        run: |
          # Native phone push via ntfy.sh (APNs handles its own topics; GitHub runners can't
          # reach the self-hosted ntfy behind the tailnet). Topic name doubles as the
          # credential — unguessable hex stored as a repo secret. Fired for ANY failure:
          # 403 challenge, 503 DB wedge ("schema cache" class), 504 inactivity timeout.
          curl -sS -X POST -o /dev/null -w 'ntfy alert: %{http_code}\n' \
            -H "Title: Recatalogue sweep FAILED" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "Release catalogue sweep workflow failed ($(date -u +%FT%TZ)). If 503 schema-cache/504: Supabase wedged again — check: gh run view $(echo ${GITHUB_RUN_ID:-unknown})." \
            "https://ntfy.sh/$NTFY_CI_TOPIC"
