name: Release catalogue sweep

# Builds and refreshes release catalogues in the background.
#
# Every other catalog trigger is demand-driven: a save, a search, a button. So an artist who is
# catalogued once and not searched again quietly stops producing release alerts, and their
# artist page keeps showing the releases they had that day. See api/functions/recatalog-sweep.ts.
#
# A GitHub Actions cron rather than a scheduled Netlify function: there are no scheduled Netlify
# functions in this repo, and this is the established precedent (schedule-social-posts.yml,
# upstash-keepalive.yml).
#
# ## Cadence: every 6 hours
#
# One run asks for at most 25 artists — one background invocation's worth — so four runs a day
# is 100 artists daily. Measured against the pool on 2026-08-02 (2,564 artists with a
# catalogue-able link, 9 of them saved by anybody) that means:
#
#   - Saved artists come round as soon as their 7-day cooldown expires. They sort first, and
#     there are single figures of them, so an alert never waits behind the backfill.
#   - The rest rotate roughly monthly, which is the right order for artist-page freshness.
#   - The ~2,400 artists with no catalogue at all drain in about three weeks.
#
# What it costs the sites we crawl: the background function paces itself at one second between
# artists and one second between release-page fetches, and stops starting them nine minutes into
# a fifteen-minute invocation. At the response times measured on 2026-08-07 that deadline allows
# roughly 160 release pages per run, on top of one grid page per Bandcamp artist (~17 of a
# 25-artist batch). Four runs is therefore on the order of 700 sequential Bandcamp requests a day,
# with a hard ceiling of 1,300 if Bandcamp ever answers fast enough to reach the 300-fetch
# backstop — around one request a minute averaged, and never more than one a second, against
# robots-permitted paths.
#
# That was ~470/day until the detail cap was raised from 100, which had been rationing one
# invocation's release-page reads across the whole batch and leaving the artists late in each
# sweep unpriced. The extra cost is also self-limiting: a release page is re-read only every 30
# days, so once the backlog drains the raised cap goes largely unspent and the steady state is
# roughly 170 re-reads a day.
#
# The lever if the *artist* tail needs to be tighter is this cadence, not the batch size, which is
# capped by what one invocation can do. Note the two are different problems — see the
# SWEEP_BATCH_SIZE comment in api/functions/recatalog-sweep.ts.
#
# Safe to over-run. A duplicate invocation finds the same artists claimed and does nothing, so
# re-running by hand is free.

on:
  schedule:
    - cron: '0 1,7,13,19 * * *' # Every 6 hours, offset off the top-of-day cron rush
  workflow_dispatch: # Manual trigger from the GitHub UI

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Request a re-catalogue of the stalest saved artists
        env:
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
        run: |
          if [ -z "$INTERNAL_FUNCTION_SECRET" ]; then
            echo "::error::INTERNAL_FUNCTION_SECRET secret is not set"
            exit 1
          fi

          response=$(curl -sS -X POST -w '\n%{http_code}' \
            -H "Authorization: Bearer $INTERNAL_FUNCTION_SECRET" \
            https://unstream.stream/.netlify/functions/recatalog-sweep)

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          # Any non-200 fails the run on purpose. A sweep that reports success while refusing to
          # do anything — cataloging disabled, database unreadable — is the exact silent failure
          # this workflow exists to prevent.
          if [ "$status" != "200" ]; then
            echo "::error::Sweep failed with HTTP $status: $body"
            exit 1
          fi

          # Worth reading rather than skipping past. `requested: 0` is fine when `inCooldown`
          # accounts for the whole `catalogueable` pool — everything really is caught up. It is
          # not fine if `catalogueable` has collapsed, which is what a broken or truncated
          # selection query looks like, and the two are indistinguishable without these counts.
          echo "Sweep OK: $body"
