name: Supabase migrations

# Applies new migrations to production on every push to main that touches
# supabase/migrations/. Also runnable by hand (workflow_dispatch) from a feature branch, to get a
# migration into production ahead of its PR merging — the deploy preview shares the production
# database, so an additive migration sometimes has to land early for the preview to exercise it.
#
# ⚠️ If you run it from a branch, MERGE THAT BRANCH PROMPTLY, or split the migration into its own
# PR and merge that first.
#
# `supabase db push` refuses to run at all when the remote has an applied version that isn't in
# supabase/migrations/ locally — "Remote migration versions not found in local migrations
# directory" — and it aborts *before* applying anything. So a migration applied from an unmerged
# branch silently blocks every later migration on main, including everybody else's.
#
# That is not hypothetical: 20260809120000_bandcamp-collection.sql was applied this way on
# 2026-08-09 from the still-open PR #438, and from 2026-08-10 to 2026-08-11 three consecutive runs
# on main failed without applying a thing. One of the migrations left stranded added
# `releases.alert_sent_at`, which api/functions/notifications.ts had already shipped code against —
# so release alerts were broken for about 30 hours while this workflow reported the failure to
# nobody in particular.
#
# The failure is loud in Actions and invisible everywhere else. Check this workflow went green
# after any merge that adds a migration.
#
# ## Credentials: a connection string, not an access token
#
# SUPABASE_DB_URL is the production database's Session pooler connection string, password
# included (Supabase dashboard → Connect → Session pooler). Until 2026-10-06 this workflow used
# `supabase link` with SUPABASE_ACCESS_TOKEN, but Supabase stopped issuing classic (account-wide)
# access tokens, and the scoped ones that replaced them can't run `supabase link`
# (supabase/supabase#50244: it 403s revealing the project's API keys). A connection string is the
# narrower credential anyway: it reaches this one database and nothing else in the account.
# db-backup.yml uses the same secret, so don't remove it while either workflow exists.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed migrations
        id: changes
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- supabase/migrations/ 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes detected. Skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed migration files:"
            echo "$changed"
          fi

      - name: Setup Supabase CLI
        if: steps.changes.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        if: steps.changes.outputs.changed == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
