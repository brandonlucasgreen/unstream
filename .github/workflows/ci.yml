name: CI

# The typecheck and test gate that used to live inside the Netlify build. It moved here
# so a deploy only builds the site: GitHub Actions minutes are free on public repos,
# and running the suites here gives PR feedback without spending a deploy.
#
# This does mean a red main no longer blocks a deploy on its own. Requiring this check
# in the branch protection rules for `main` is what restores that gate — see the
# "Testing" section of CLAUDE.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Checkout and test only. `npm ci` runs third-party install scripts on every PR, so
# this job holds a read-only token rather than inheriting the repo default.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API function tests
        run: npm run test:api

      - name: Web unit tests
        run: npm run test:unit

  # The edge functions (api/edge/) import from URLs only Deno resolves, so the Node typecheck above
  # can't see them, and for a long time nothing checked them at all: they render every artist and
  # release page for crawlers, and a type error surfaced as a failed page. `deno check` does see
  # them. A separate job so a slow esm.sh can't hold up the main gate, and with no lock file
  # because `netlify dev` rewrites deno.lock on every run. The Deno version is pinned for the same
  # reason the Supabase CLI is in the other workflows; bump it on purpose.
  edge-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.8"

      - name: Typecheck edge functions
        run: deno check --no-lock api/edge/*.ts
